      +
      diff --git a/textkit/csvlite.py b/textkit/csvlite.py
      index a1488ac..3d24b14 100644
      --- a/textkit/csvlite.py
      +++ b/textkit/csvlite.py
      @@ -8,20 +8,34 @@ def parse_line(line):
             '"say ""hi""",x' -> ['say "hi"', 'x'].
           - An unterminated quoted field raises ValueError.
           '''
      -    fields, cur, quoted = [], "", False
      -    for c in line:
      +    fields = []
      +    cur = ""
      +    quoted = False
