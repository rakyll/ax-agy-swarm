      +++ b/tests/test_wrap.py
      @@ -16,3 +16,25 @@ class TestWrap(unittest.TestCase):
           def test_bad_width(self):
               with self.assertRaises(ValueError):
                   wrap("x", 0)
      +
      +    def test_paragraphs(self):
      +        self.assertEqual(
      +            wrap("word1 word2\n\nword3 word4\n\n\nword5", 11),
      +            ["word1 word2", "", "word3 word4", "", "word5"]
      +        )
      +
      +    def test_blank_lines_spaces_tabs(self):
      +        self.assertEqual(
      +            wrap("p1\n \t \np2", 10),
      +            ["p1", "", "p2"]
      +        )
      +
      +    def test_line_fits_exactly(self):
      +        self.assertEqual(
      +            wrap("abc def ghi", 11),
      +            ["abc def ghi"]
      +        )
      +
      +    def test_no_words(self):
      +        self.assertEqual(wrap("   \n \t  \n", 10), [])
      +        self.assertEqual(wrap("", 10), [])
      diff --git a/textkit/wrap.py b/textkit/wrap.py
      index a296bae..12b8fd0 100644
      --- a/textkit/wrap.py
      +++ b/textkit/wrap.py
      @@ -11,4 +11,48 @@ def wrap(text, width):
           - Text with no words returns [].
           - width < 1 raises ValueError.
           """
      -    raise NotImplementedError
      +    if width < 1:
      +        raise ValueError("Width must be >= 1")
      +
      +    lines = text.splitlines()
      +    paragraphs = []
      +    current_paragraph_words = []
      +
      +    for line in lines:
      +        if not line.strip():
      +            if current_paragraph_words:
      +                paragraphs.append(current_paragraph_words)
      +                current_paragraph_words = []
      +        else:
      +            current_paragraph_words.extend(line.split())
      +
      +    if current_paragraph_words:
      +        paragraphs.append(current_paragraph_words)
      +
      +    if not paragraphs:
      +        return []
      +
      +    result = []
      +    for i, p_words in enumerate(paragraphs):
      +        if i > 0:
      +            result.append("")
      +
      +        current_line = []
      +        current_length = 0
      +
      +        for word in p_words:
      +            if not current_line:
      +                current_line.append(word)
      +                current_length = len(word)
      +            else:
      +                if current_length + 1 + len(word) <= width:
      +                    current_line.append(word)
      +                    current_length += 1 + len(word)
      +                else:
      +                    result.append(" ".join(current_line))
      +                    current_line = [word]
      +                    current_length = len(word)
      +        if current_line:
      +            result.append(" ".join(current_line))
      +
      +    return result
      diff --git a/tests/test_roman.py b/tests/test_roman.py
      index 4e9d663..356ac73 100644
      --- a/tests/test_roman.py
      +++ b/tests/test_roman.py
      @@ -1,6 +1,6 @@
       import unittest
       
