      +        c = line[i]
               if quoted:
                   if c == '"':
      -                quoted = False
      +                if i + 1 < len(line) and line[i+1] == '"':
      +                    cur += '"'
      +                    i += 1
      +                else:
      +                    quoted = False
                   else:
                       cur += c
      -        elif c == '"':
      -            quoted = True
      -        elif c == ",":
      -            fields.append(cur)
      -            cur = ""
               else:
      -            cur += c
      -    if cur:
      -        fields.append(cur)
      +            if c == '"':
      +                quoted = True
