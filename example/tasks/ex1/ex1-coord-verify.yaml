       class TestToRoman(unittest.TestCase):
      @@ -13,3 +13,14 @@ class TestToRoman(unittest.TestCase):
               for bad in (0, 4000, -1):
                   with self.assertRaises(ValueError):
                       to_roman(bad)
      +
      +class TestFromRoman(unittest.TestCase):
      +    def test_round_trip(self):
      +        for i in range(1, 4000):
      +            roman = to_roman(i)
      +            self.assertEqual(from_roman(roman), i)
      +            
      +    def test_rejection(self):
      +        for bad in ("", "IIII", "IC", "VX", "MMMM", "iv", "XCX", "IVI", 123, None):
      +            with self.assertRaises(ValueError):
      +                from_roman(bad)
      diff --git a/textkit/roman.py b/textkit/roman.py
      index b640e38..2b6dac9 100644
      --- a/textkit/roman.py
      +++ b/textkit/roman.py
      @@ -24,4 +24,16 @@ def from_roman(s):
           (uppercase, 1..3999). Anything else, such as "IIII", "IC", "VX",
           "MMMM", "iv" or "", raises ValueError.
           """
      -    raise NotImplementedError
      +    if not isinstance(s, str) or not s:
      +        raise ValueError("invalid input")
      +    n = 0
      +    index = 0
      +    for value, sym in NUMERALS:
      +        while s.startswith(sym, index):
      +            n += value
      +            index += len(sym)
      +    if index != len(s):
      +        raise ValueError("invalid characters")
      +    if to_roman(n) != s:
      +        raise ValueError("not canonical")
      +    return n
      diff --git a/tests/test_csvlite.py b/tests/test_csvlite.py
      index 674e7e6..f683d74 100644
      --- a/tests/test_csvlite.py
      +++ b/tests/test_csvlite.py
      @@ -9,3 +9,20 @@ class TestParseLine(unittest.TestCase):
       
           def test_quoted_comma(self):
               self.assertEqual(parse_line('"x,y",z'), ["x,y", "z"])
      +
      +    def test_empty_string(self):
      +        self.assertEqual(parse_line(""), [""])
      +
      +    def test_empty_fields(self):
      +        self.assertEqual(parse_line("a,,b"), ["a", "", "b"])
      +        self.assertEqual(parse_line("a,b,"), ["a", "b", ""])
      +        self.assertEqual(parse_line(",a,b"), ["", "a", "b"])
      +        self.assertEqual(parse_line(","), ["", ""])
      +
      +    def test_quotes(self):
      +        self.assertEqual(parse_line('"say ""hi""",x'), ['say "hi"', 'x'])
      +
      +    def test_unterminated(self):
      +        with self.assertRaises(ValueError):
