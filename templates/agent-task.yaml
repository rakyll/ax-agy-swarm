# An Antigravity agent working toward spec.goal.text inside a sandbox.
# Based on ~/ax/hack/hero-demo/task-starter.yaml. Copy to tasks/<run>/<name>.yaml,
# replace every <...>, then `bin/axs submit tasks/<run>/<name>.yaml`.
#
# Keep image and limits identical to the workspace's spec.profile so the task
# starts from the pre-warmed snapshot. The gateway must allow
# generativelanguage.googleapis.com and inject the Gemini key (hero-demo-gw does).
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: <run>-<worker>-<slug>
  atespace: default
  labels:
    swarm-run: <run>
    swarm-worker: <worker>
spec:
  profile:
    image: "ghcr.io/agentexecutor/antigravity@sha256:0ccd91d03f996c375d6d391dc20106102187f15210a0016212b6721cd8044078"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  workspace:
    name: <workspace>
  gateway:
    name: hero-demo-gw
  env:
    - name: AGY_RUNTIME_INSTALL
      value: "true"
    - name: GEMINI_API_KEY
      value: placeholder # replaced outside the sandbox by the gateway
  sessionId: <run>
  goal:
    text: |
      <goal: one self-contained objective. Say which files to change and how to
      verify. End with: write a short report to /workspace/reports/<slug>.md>
  debug: true
